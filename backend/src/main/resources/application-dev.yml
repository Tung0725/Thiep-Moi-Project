spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:wedding_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      "[hibernate.dialect]": org.hibernate.dialect.PostgreSQLDialect
      "[hibernate.format_sql]": false
      "[hibernate.jdbc.batch_size]": 20
    open-in-view: false

logging:
  level:
    "[com.wedding]": DEBUG
    "[org.springframework.security]": INFO
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.orm.jdbc.bind]": TRACE

app:
  jwt:
    secret: ${JWT_SECRET:dev_only_dummy_secret_key_minimum_256_bits_for_local_testing_only_12345}
  storage:
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
